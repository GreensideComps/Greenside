name = "greenside-entry-allocator"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Reconciliation sweep (src/reconcile.ts). Webhooks carry the latency; this
# carries the guarantee. The cron that fires picks the look-back: the one equal
# to RECONCILE_DEEP_CRON runs the deep (59-day) sweep, any other the trailing
# (2-hour) one.
[triggers]
crons = ["*/15 * * * *", "0 3 * * *"]

# Persist Worker logs beyond a live `wrangler tail`, so the sweep's
# reconcile_summary lines can be read after the fact.
[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "greenside_entries"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[vars]
# DRY_RUN is deliberately a plain var, not a secret, so its value is visible in
# the dashboard. Only the exact string "false" permits a write. An unset,
# misspelled or empty variable leaves the Worker read-only.
DRY_RUN = "true"

# Pinned, never "latest". A quarterly Shopify release must not silently change
# the shape of an operation that decides who is in a prize draw.
SHOPIFY_API_VERSION = "2026-07"
SHOPIFY_STORE = "7r5csb-1j.myshopify.com"
ALLOWED_SHOP_DOMAIN = "7r5csb-1j.myshopify.com"
RECONCILE_DEEP_CRON = "0 3 * * *"

# Secrets are NEVER defined here. Set them with:
#   npx wrangler secret put SHOPIFY_CLIENT_ID
#   npx wrangler secret put SHOPIFY_CLIENT_SECRET
#   npx wrangler secret put SHOPIFY_WEBHOOK_SECRET
# (add --env qa for the QA worker).
#
# They are the Dev Dashboard app's client ID and client secret; webhooks are
# signed with the same client secret. There is no access token to set: the
# Worker exchanges the credentials for a 24-hour offline token itself
# (client-credentials grant), keeps it in memory and renews it before expiry.
#
# The app must hold ONLY:
#   read_orders, read_products
# It must never hold write_inventory; the Worker refuses a token that does.
# See README.

# ---------------------------------------------------------------------------
# QA environment.
#
# A named environment, NOT a replacement for the default one above: the
# production binding, its placeholder database_id and the default worker name
# are all untouched by anything in this block. Deploying `--env qa` publishes a
# separate worker, `greenside-entry-allocator-qa`.
#
# vars and d1_databases are NON-INHERITABLE in Wrangler, so every value the QA
# worker needs is restated here. Omitting DRY_RUN would leave it unset, which
# the Worker treats as read-only -- safe, but silent. It is spelled out instead.
# ---------------------------------------------------------------------------
[env.qa]

[[env.qa.d1_databases]]
binding = "DB"
database_name = "greenside_entries_qa"
database_id = "5c7ecce9-5b2f-45eb-b5a6-ab78f14698be"
migrations_dir = "migrations"

[env.qa.vars]
DRY_RUN = "true"
SHOPIFY_API_VERSION = "2026-07"
SHOPIFY_STORE = "7r5csb-1j.myshopify.com"
ALLOWED_SHOP_DOMAIN = "7r5csb-1j.myshopify.com"
# QA runs the deep sweep twice an hour, so a QA session can watch one.
RECONCILE_DEEP_CRON = "20,50 * * * *"

[env.qa.triggers]
crons = ["*/15 * * * *", "20,50 * * * *"]
